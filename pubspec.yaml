name: rea_flight_recorder
description: In-app diagnostic blackbox and flight recorder for Flutter. Captures logs, crashes, and network calls in a rotating buffer with a developer viewer modal.
version: 0.1.0
homepage: https://github.com/Churtech/rea-flight-recorder
repository: https://github.com/Churtech/rea-flight-recorder.git
issue_tracker: https://github.com/Churtech/rea-flight-recorder/issues

environment:
  sdk: ^3.0.0
  flutter: ">=3.3.0"

dependencies:
  flutter:
    sdk: flutter
  dio: ">=5.0.0 <6.0.0"
  path_provider: ^2.1.0
  share_plus: ">=10.0.0 <13.0.0"
  web: ^1.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
